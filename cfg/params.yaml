/**:
  ros__parameters:
    use_sim_time: false
    frames/odom: odom
    frames/baselink: base_link
    frames/lidar: lidar
    frames/imu: imu

    map/waitUntilMove: false
    map/dense/filtered: false
    map/sparse/leafSize: 0.1

    odom/gravity: 9.80665
    odom/computeTimeOffset: true

    odom/imu/approximateGravity: true
    odom/imu/calibration/gyro: true
    odom/imu/calibration/accel: true
    odom/imu/calibration/time: 3.0
    odom/imu/bufferSize: 15000

    # Tuned for yaw accuracy: the perceptive policies rotate their height scan
    # by this odometry's yaw, so rotation error shows up directly in the
    # observation.
    odom/preprocessing/cropBoxFilter/size: 1.0
    odom/preprocessing/voxelFilter/res: 0.03

    odom/keyframe/threshD: 0.5
    odom/keyframe/threshR: 30.0

    odom/submap/keyframe/knn: 20
    odom/submap/keyframe/kcv: 20
    odom/submap/keyframe/kcc: 20
    odom/gicp/minNumPoints: 64
    odom/gicp/kCorrespondences: 16
    odom/gicp/maxCorrespondenceDistance: 0.7
    odom/gicp/maxIterations: 48
    odom/gicp/transformationEpsilon: 0.001
    odom/gicp/rotationEpsilon: 0.001
    odom/gicp/initLambdaFactor: 1e-9

    odom/geo/Kp: 5.0
    odom/geo/Kv: 8.0
    odom/geo/Kq: 5.0
    odom/geo/Kab: 5.0
    odom/geo/Kgb: 2.0
    odom/geo/abias_max: 5.0
    odom/geo/gbias_max: 0.5
